<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Gallery</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HERO -->
    <section class="hero">
        <div class="hero-content">
            <h1>Gallery</h1>
            <p>Kumpulan media Tech Community</p>

            <nav class="hero-nav">
                <a href="index.html">Home</a>
                <a href="form.html">Daftar</a>
                <a href="gallery.html">Multimedia</a>
            </nav>
        </div>
    </section>

    <!-- GALLERY -->
    <section class="gallery-section">

        <!-- FOTO -->
        <div class="gallery-card">
            <h2>Foto Kegiatan</h2>

            <div class="image-scroll">
                <img src="img/foto1.jpg">
                <img src="img/foto2.jpg">
                <img src="img/foto3.jpg">
            </div>

        </div>

        <div class="gallery-card">
            <h2>Video</h2>

            <iframe width="100%" height="200" src="https://www.youtube.com/embed/7DYcTAJK1kk" frameborder="0"
                allowfullscreen>
            </iframe>

        </div>

        <!-- SPOTIFY -->
        <div class="gallery-card">
            <h2>Audio</h2>

            <iframe data-testid="embed-iframe" style="border-radius:12px"
                src="https://open.spotify.com/embed/track/3nqqDo8CcCLke3ZoTgiOKf?utm_source=generator" width="100%"
                height="352" frameborder="0" allowfullscreen
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy">
            </iframe>

        </div>

    </section>

</body>

</html>
